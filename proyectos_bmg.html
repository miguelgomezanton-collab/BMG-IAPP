<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyectos — BMG</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root {
  --bg:#f7f7f5; --surface:#ffffff; --surface2:#f2f2ef;
  --border:#e0dfd9; --border-strong:#c8c7c0;
  --ink:#1a1a18; --ink-dim:#6b6b65; --ink-faint:#a8a8a2;
  --green:#1a6b3c; --green-bg:#eaf4ee;
  --blue:#1a4a8a; --blue-bg:#eef3fc;
  --amber:#9a5a00;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14px;min-height:100vh;display:flex;flex-direction:column}

nav{background:var(--ink);color:white;height:52px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-shrink:0}
.nav-left{display:flex;align-items:center;gap:16px}
.nav-back{font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(255,255,255,.45);cursor:pointer;padding:4px 0;transition:color .15s;text-decoration:none}
.nav-back:hover{color:rgba(255,255,255,.8)}
.nav-sep{color:rgba(255,255,255,.2)}
.nav-title{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.04em}
.nav-right{font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(255,255,255,.35)}

.layout{display:flex;flex:1;min-height:0}

.sidebar{width:196px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sb-head{padding:16px 16px 12px;border-bottom:1px solid var(--border)}
.sb-head-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:2px}
.sb-head-sub{font-size:11px;color:var(--ink-dim)}
.sb-months{flex:1;overflow-y:auto;padding:8px 0}
.sb-section-label{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);padding:10px 16px 4px}
.sb-month{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;cursor:pointer;font-size:12px;color:var(--ink-dim);transition:background .1s;border-left:2px solid transparent}
.sb-month:hover{background:var(--surface2);color:var(--ink)}
.sb-month.active{background:var(--blue-bg);color:var(--blue);border-left-color:var(--blue);font-weight:600}
.sb-bottom{padding:12px 16px;border-top:1px solid var(--border)}
.sb-annual-btn{width:100%;padding:8px 10px;background:transparent;border:1px solid var(--border);font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);cursor:pointer;border-radius:3px;transition:all .15s;text-align:left}
.sb-annual-btn:hover{border-color:var(--ink);color:var(--ink)}
.sb-annual-btn.active{background:var(--ink);color:white;border-color:var(--ink)}

.main{flex:1;overflow-y:auto;padding:0}
.main-inner{padding:24px 28px 60px}

.page-title{font-size:20px;font-weight:700;margin-bottom:6px}
.page-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);margin-bottom:24px}

.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.table{width:100%;border-collapse:collapse;font-size:12px}

.table thead{background:var(--ink)}
.table thead tr.main-header th{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.8);padding:10px 12px;text-align:center;font-weight:600;border-left:1px solid rgba(255,255,255,.1)}
.table thead tr.main-header th:first-child{border-left:none;text-align:left}

.table thead tr.sub-header th{font-family:'IBM Plex Mono',monospace;font-size:9px;color:rgba(255,255,255,.6);padding:8px 12px;text-align:center;font-weight:500;background:rgba(0,0,0,.2);border-left:1px solid rgba(255,255,255,.05)}
.table thead tr.sub-header th:first-child,
.table thead tr.sub-header th:nth-child(2){text-align:left}

.table tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
.table tbody tr:hover{background:var(--surface2)}
.table tbody tr:last-child{border-bottom:none}

.table tbody tr.green{background:rgba(26,107,60,.08)}
.table tbody tr.yellow{background:rgba(202,138,4,.08)}
.table tbody tr.red{background:rgba(192,57,43,.08)}

.table tbody td{padding:10px 12px;text-align:right;border-left:1px solid var(--border)}
.table tbody td:first-child,
.table tbody td:nth-child(2){text-align:left;border-left:none}

.client-cell{font-weight:600;color:var(--ink)}
.project-cell{color:var(--ink-dim)}

.hours-cell{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim)}
.cost-cell{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--ink)}
.total-cell{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:var(--blue)}

.col-group-legal{background:rgba(239,68,68,.05)}
.col-group-paralegal{background:rgba(34,197,94,.05)}
.col-group-it{background:rgba(59,130,246,.05)}
.col-group-total{background:rgba(26,74,138,.08)}

.empty-state{text-align:center;padding:60px 24px;color:var(--ink-dim)}
.empty-icon{font-size:64px;opacity:.3;margin-bottom:16px}
.empty-text{font-size:14px}

.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim)}

.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px}
.modal{background:var(--surface);border-radius:8px;max-width:800px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:4px}
.modal-subtitle{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim)}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;flex-shrink:0}

.desglose-table{width:100%;border-collapse:collapse;font-size:12px}
.desglose-table thead{background:var(--surface2)}
.desglose-table th{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:10px 12px;text-align:left;font-weight:600;border-bottom:2px solid var(--border)}
.desglose-table tbody tr{border-bottom:1px solid var(--border)}
.desglose-table tbody tr:last-child{border-bottom:none}
.desglose-table td{padding:10px 12px}
.desglose-table .emp-name{font-weight:600;color:var(--ink)}
.desglose-table .cat-badge{display:inline-block;padding:3px 8px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.desglose-table .cat-badge.LEGAL{background:rgba(239,68,68,.15);color:#b91c1c}
.desglose-table .cat-badge.PARALEGAL{background:rgba(34,197,94,.15);color:#15803d}
.desglose-table .cat-badge.IT{background:rgba(59,130,246,.15);color:#1e40af}
.desglose-table .num-cell{font-family:'IBM Plex Mono',monospace;text-align:right;font-weight:600}

.btn{padding:8px 16px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-secondary{background:var(--surface2);color:var(--ink-dim)}
.btn-secondary:hover{background:var(--border);color:var(--ink)}
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a class="nav-back" href="index.html">← BMG</a>
    <span class="nav-sep">/</span>
    <span class="nav-title">Proyectos</span>
  </div>
  <div class="nav-right" id="nav-right">2026</div>
</nav>

<div class="layout">
  <div class="sidebar">
    <div class="sb-head">
      <div class="sb-head-label">Por Mes</div>
      <div class="sb-head-sub">Costes por proyecto</div>
    </div>
    <div class="sb-months" id="sb-months"></div>
    <div class="sb-bottom">
      <button class="sb-annual-btn" id="btn-annual" onclick="window.mostrarAnual()">📊 Resumen Anual</button>
    </div>
  </div>

  <div class="main">
    <div class="main-inner" id="main-content"></div>
  </div>
</div>

<script type="text/babel">
const { useState, useEffect } = React;

const MESES = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
const MESES_CORTOS = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
const CATEGORIAS = ['LEGAL', 'PARALEGAL', 'IT'];

function App() {
  const [vistaActiva, setVistaActiva] = useState('ENERO'); // mes o 'ANUAL'
  const [loading, setLoading] = useState(true);
  const [costesHora, setCostesHora] = useState({});
  const [empleadosConfig, setEmpleadosConfig] = useState([]);
  const [objetivoRentabilidad, setObjetivoRentabilidad] = useState(60);
  const [modalDesglose, setModalDesglose] = useState(null); // {cliente, proyecto, mes, datos}

  useEffect(() => {
    cargarDatos();
  }, []);

  useEffect(() => {
    renderSidebar();
  }, [vistaActiva]);

  const cargarDatos = () => {
    try {
      setLoading(true);
      
      // Cargar costes/hora
      const costesData = localStorage.getItem('bmg_costes_hora');
      if (costesData) {
        setCostesHora(JSON.parse(costesData));
      }

      // Cargar empleados con categorías
      const empData = localStorage.getItem('bmg_empleados_config');
      if (empData) {
        setEmpleadosConfig(JSON.parse(empData));
      }

      // Cargar objetivo de rentabilidad
      const objData = localStorage.getItem('bmg_objetivo_rentabilidad');
      if (objData) {
        setObjetivoRentabilidad(parseFloat(objData));
      }
    } catch (error) {
      console.error('Error cargando datos:', error);
    } finally {
      setLoading(false);
    }
  };

  const renderSidebar = () => {
    const year = new Date().getFullYear();
    let html = `<div class="sb-section-label">${year}</div>`;
    
    MESES.forEach((mes, idx) => {
      const active = mes === vistaActiva ? 'active' : '';
      html += `
        <div class="sb-month ${active}" onclick="window.seleccionarMes('${mes}')">
          <span>${MESES_CORTOS[idx]}</span>
        </div>
      `;
    });
    
    document.getElementById('sb-months').innerHTML = html;
    
    // Actualizar botón anual
    const btnAnual = document.getElementById('btn-annual');
    if (vistaActiva === 'ANUAL') {
      btnAnual.classList.add('active');
    } else {
      btnAnual.classList.remove('active');
    }
  };

  window.seleccionarMes = (mes) => {
    setVistaActiva(mes);
    document.getElementById('nav-right').textContent = mes + ' 2026';
  };

  window.mostrarAnual = () => {
    setVistaActiva('ANUAL');
    document.getElementById('nav-right').textContent = 'Resumen Anual 2026';
  };

  const obtenerCategoriaEmpleado = (nombreEmpleado) => {
    const empleado = empleadosConfig.find(e => e.nombre === nombreEmpleado);
    return empleado ? empleado.categoria : null;
  };

  const obtenerFacturacion = (cliente, proyecto, mes) => {
    try {
      const facturacionData = localStorage.getItem('bmg_facturacion');
      if (!facturacionData) return 0;
      
      const facturacion = JSON.parse(facturacionData);
      
      if (mes === 'ANUAL') {
        // Sumar facturación de todos los meses
        let total = 0;
        MESES.forEach(m => {
          const key = `${m}_${cliente}_${proyecto}`;
          if (facturacion[key]) {
            total += facturacion[key].importe || 0;
          }
        });
        return total;
      } else {
        const key = `${mes}_${cliente}_${proyecto}`;
        return facturacion[key] ? (facturacion[key].importe || 0) : 0;
      }
    } catch (error) {
      return 0;
    }
  };

  const obtenerDesgloseEmpleados = (cliente, proyecto, mes) => {
    try {
      const imputacionData = localStorage.getItem('bmg_datos_imputacion');
      if (!imputacionData) return [];
      
      const imputaciones = JSON.parse(imputacionData);
      const desglose = [];
      
      Object.entries(imputaciones).forEach(([key, imp]) => {
        // Si es ANUAL, incluir todos los meses. Si no, solo el mes específico
        if (mes !== 'ANUAL' && imp.mes !== mes) return;
        
        imp.proyectos.forEach(p => {
          if (p.cliente === cliente && p.proyecto === proyecto) {
            const categoria = obtenerCategoriaEmpleado(imp.empleado);
            const costeHora = costesHora[categoria] || 0;
            
            desglose.push({
              empleado: imp.empleado,
              mes: imp.mes,
              categoria: categoria || 'N/A',
              horas: p.horas,
              costeHora: costeHora,
              costeTotal: p.horas * costeHora
            });
          }
        });
      });
      
      return desglose;
    } catch (error) {
      return [];
    }
  };

  const abrirModalDesglose = (cliente, proyecto) => {
    const desglose = obtenerDesgloseEmpleados(cliente, proyecto, vistaActiva);
    setModalDesglose({ cliente, proyecto, mes: vistaActiva, desglose });
  };

  const calcularDatosMes = (mes) => {
    try {
      const imputacionData = localStorage.getItem('bmg_datos_imputacion');
      if (!imputacionData) return {};
      
      const imputaciones = JSON.parse(imputacionData);
      const proyectosMap = {};
      
      // Filtrar solo imputaciones del mes específico
      Object.entries(imputaciones).forEach(([key, imp]) => {
        if (imp.mes !== mes) return;
        
        const categoria = obtenerCategoriaEmpleado(imp.empleado);
        if (!categoria) return;
        
        imp.proyectos.forEach(p => {
          const proyectoKey = `${p.cliente}|||${p.proyecto}`;
          
          if (!proyectosMap[proyectoKey]) {
            proyectosMap[proyectoKey] = {
              cliente: p.cliente,
              proyecto: p.proyecto,
              horas: { LEGAL: 0, PARALEGAL: 0, IT: 0 },
              coste: { LEGAL: 0, PARALEGAL: 0, IT: 0 }
            };
          }
          
          proyectosMap[proyectoKey].horas[categoria] += p.horas;
          proyectosMap[proyectoKey].coste[categoria] += p.horas * (costesHora[categoria] || 0);
        });
      });
      
      return proyectosMap;
    } catch (error) {
      console.error('Error calculando datos:', error);
      return {};
    }
  };

  const calcularDatosAnuales = () => {
    const proyectosMap = {};
    
    MESES.forEach(mes => {
      const datosMes = calcularDatosMes(mes);
      
      Object.entries(datosMes).forEach(([key, datos]) => {
        if (!proyectosMap[key]) {
          proyectosMap[key] = {
            cliente: datos.cliente,
            proyecto: datos.proyecto,
            horas: { LEGAL: 0, PARALEGAL: 0, IT: 0 },
            coste: { LEGAL: 0, PARALEGAL: 0, IT: 0 }
          };
        }
        
        CATEGORIAS.forEach(cat => {
          proyectosMap[key].horas[cat] += datos.horas[cat];
          proyectosMap[key].coste[cat] += datos.coste[cat];
        });
      });
    });
    
    return proyectosMap;
  };

  const formatearEuros = (cantidad) => {
    return new Intl.NumberFormat('es-ES', {
      minimumFractionDigits: 0,
      maximumFractionDigits: 0
    }).format(Math.round(cantidad));
  };

  const getColorClase = (margenPct) => {
    if (margenPct >= objetivoRentabilidad) return 'green';
    if (margenPct > 0) return 'yellow';
    return 'red';
  };

  if (loading) {
    return <div className="loading">⏳ Cargando proyectos...</div>;
  }

  const datos = vistaActiva === 'ANUAL' ? calcularDatosAnuales() : calcularDatosMes(vistaActiva);
  const proyectos = Object.values(datos);

  return (
    <>
      {/* MODAL DE DESGLOSE */}
      {modalDesglose && (
        <div className="modal-overlay" onClick={() => setModalDesglose(null)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">{modalDesglose.cliente} — {modalDesglose.proyecto}</div>
              <div className="modal-subtitle">
                Desglose de horas por empleado · {modalDesglose.mes === 'ANUAL' ? 'Año completo' : modalDesglose.mes}
              </div>
            </div>
            <div className="modal-body">
              {modalDesglose.desglose.length === 0 ? (
                <div style={{textAlign: 'center', padding: '40px', color: 'var(--ink-dim)'}}>
                  No hay imputaciones para este proyecto
                </div>
              ) : (
                <table className="desglose-table">
                  <thead>
                    <tr>
                      <th>Empleado</th>
                      {modalDesglose.mes === 'ANUAL' && <th>Mes</th>}
                      <th>Categoría</th>
                      <th style={{textAlign: 'right'}}>Horas</th>
                      <th style={{textAlign: 'right'}}>€/h</th>
                      <th style={{textAlign: 'right'}}>Coste Total</th>
                    </tr>
                  </thead>
                  <tbody>
                    {modalDesglose.desglose.map((d, idx) => (
                      <tr key={idx}>
                        <td className="emp-name">{d.empleado}</td>
                        {modalDesglose.mes === 'ANUAL' && <td style={{fontSize: '11px', color: 'var(--ink-dim)'}}>{d.mes}</td>}
                        <td>
                          <span className={`cat-badge ${d.categoria}`}>{d.categoria}</span>
                        </td>
                        <td className="num-cell">{d.horas.toFixed(1)}h</td>
                        <td className="num-cell" style={{color: 'var(--ink-dim)'}}>{d.costeHora}€</td>
                        <td className="num-cell" style={{color: 'var(--blue)'}}>{formatearEuros(d.costeTotal)}€</td>
                      </tr>
                    ))}
                    <tr style={{borderTop: '2px solid var(--border)', background: 'var(--surface2)'}}>
                      <td colSpan={modalDesglose.mes === 'ANUAL' ? 3 : 2} style={{fontWeight: 700}}>TOTAL</td>
                      <td className="num-cell" style={{fontWeight: 700}}>
                        {modalDesglose.desglose.reduce((sum, d) => sum + d.horas, 0).toFixed(1)}h
                      </td>
                      <td></td>
                      <td className="num-cell" style={{fontWeight: 700, color: 'var(--blue)', fontSize: '13px'}}>
                        {formatearEuros(modalDesglose.desglose.reduce((sum, d) => sum + d.costeTotal, 0))}€
                      </td>
                    </tr>
                  </tbody>
                </table>
              )}
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={() => setModalDesglose(null)}>
                Cerrar
              </button>
            </div>
          </div>
        </div>
      )}

      <div className="page-title">
        {vistaActiva === 'ANUAL' ? 'Resumen Anual de Actividad' : `Actividad Mensual - ${vistaActiva}`}
      </div>
      <div className="page-sub">
        {vistaActiva === 'ANUAL' ? 'Consolidado año 2026' : 'Por proyecto'}
      </div>

      {proyectos.length === 0 ? (
        <div className="table-wrap">
          <div className="empty-state">
            <div className="empty-icon">📊</div>
            <div className="empty-text">
              No hay imputaciones para {vistaActiva === 'ANUAL' ? 'este año' : 'este mes'}
            </div>
          </div>
        </div>
      ) : (
        <div className="table-wrap">
          <table className="table">
            <thead>
              <tr className="main-header">
                <th rowSpan="2">CLIENTE</th>
                <th rowSpan="2">PROYECTO</th>
                <th colSpan="2">LEGAL</th>
                <th colSpan="2">PARALEGAL</th>
                <th colSpan="2">IT</th>
                <th rowSpan="2">TOTAL</th>
                <th rowSpan="2">FACTURACIÓN</th>
                <th rowSpan="2">MARGEN €</th>
                <th rowSpan="2">MARGEN %</th>
              </tr>
              <tr className="sub-header">
                <th>h</th>
                <th>€</th>
                <th>h</th>
                <th>€</th>
                <th>h</th>
                <th>€</th>
              </tr>
            </thead>
            <tbody>
              {proyectos.map((p, idx) => {
                const totalHoras = p.horas.LEGAL + p.horas.PARALEGAL + p.horas.IT;
                const totalCoste = p.coste.LEGAL + p.coste.PARALEGAL + p.coste.IT;
                const facturacion = obtenerFacturacion(p.cliente, p.proyecto, vistaActiva);
                const margen = facturacion - totalCoste;
                const margenPct = facturacion > 0 ? (margen / facturacion) * 100 : 0;
                const colorClase = getColorClase(margenPct);
                
                return (
                  <tr key={idx} className={colorClase}>
                    <td className="client-cell">{p.cliente}</td>
                    <td className="project-cell" style={{cursor: 'pointer', textDecoration: 'underline'}} onClick={() => abrirModalDesglose(p.cliente, p.proyecto)}>
                      {p.proyecto}
                    </td>
                    
                    <td className="hours-cell col-group-legal">
                      {p.horas.LEGAL > 0 ? p.horas.LEGAL.toFixed(0) : ''}
                    </td>
                    <td className="cost-cell col-group-legal">
                      {p.coste.LEGAL > 0 ? formatearEuros(p.coste.LEGAL) : ''}
                    </td>
                    
                    <td className="hours-cell col-group-paralegal">
                      {p.horas.PARALEGAL > 0 ? p.horas.PARALEGAL.toFixed(0) : ''}
                    </td>
                    <td className="cost-cell col-group-paralegal">
                      {p.coste.PARALEGAL > 0 ? formatearEuros(p.coste.PARALEGAL) : ''}
                    </td>
                    
                    <td className="hours-cell col-group-it">
                      {p.horas.IT > 0 ? p.horas.IT.toFixed(0) : ''}
                    </td>
                    <td className="cost-cell col-group-it">
                      {p.coste.IT > 0 ? formatearEuros(p.coste.IT) : ''}
                    </td>
                    
                    <td className="total-cell col-group-total">
                      {formatearEuros(totalCoste)}
                    </td>
                    
                    <td className="cost-cell" style={{color: 'var(--green)', fontWeight: 600}}>
                      {facturacion > 0 ? formatearEuros(facturacion) : '-'}
                    </td>
                    
                    <td className={`cost-cell`} style={{
                      color: colorClase === 'green' ? 'var(--green)' : colorClase === 'yellow' ? '#ca8a04' : 'var(--red)', 
                      fontWeight: 600
                    }}>
                      {facturacion > 0 ? formatearEuros(margen) : '-'}
                    </td>
                    
                    <td className={`cost-cell`} style={{
                      color: colorClase === 'green' ? 'var(--green)' : colorClase === 'yellow' ? '#ca8a04' : 'var(--red)', 
                      fontWeight: 700
                    }}>
                      {facturacion > 0 ? `${margenPct.toFixed(1)}%` : '-'}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </>
  );
}

ReactDOM.render(<App />, document.getElementById('main-content'));
</script>

</body>
</html>
