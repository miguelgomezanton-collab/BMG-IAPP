<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyectos — BMG</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root {
  --bg:#f7f7f5; --surface:#ffffff; --surface2:#f2f2ef;
  --border:#e0dfd9; --border-strong:#c8c7c0;
  --ink:#1a1a18; --ink-dim:#6b6b65; --ink-faint:#a8a8a2;
  --green:#1a6b3c; --green-bg:#eaf4ee; --green-border:#b8ddc6;
  --red:#c0392b; --red-bg:#fdf0ee;
  --blue:#1a4a8a; --blue-bg:#eef3fc;
  --amber:#9a5a00; --amber-bg:#fdf5e6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14px;min-height:100vh}

nav{background:var(--ink);color:white;height:52px;padding:0 28px;display:flex;align-items:center;justify-content:space-between}
.nav-left{display:flex;align-items:center;gap:16px}
.nav-back{font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(255,255,255,.45);cursor:pointer;padding:4px 0;transition:color .15s;text-decoration:none}
.nav-back:hover{color:rgba(255,255,255,.8)}
.nav-sep{color:rgba(255,255,255,.2)}
.nav-title{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.04em}

.container{max-width:1200px;margin:0 auto;padding:24px 28px 60px}

.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.page-title{font-size:20px;font-weight:700;line-height:1}
.page-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);margin-top:5px}

.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:14px 16px;border-left:3px solid var(--border)}
.stat-card.active{border-left-color:var(--green)}
.stat-card.inactive{border-left-color:var(--red)}
.stat-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:7px}
.stat-val{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;line-height:1;color:var(--ink)}
.stat-sub{font-size:11px;color:var(--ink-dim);margin-top:4px}

.filters{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:16px;margin-bottom:20px;display:flex;gap:12px;align-items:center}
.filter-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.filter-btn{padding:6px 14px;border:1px solid var(--border);background:var(--surface);font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);cursor:pointer;border-radius:3px;transition:all .15s}
.filter-btn:hover{border-color:var(--border-strong);color:var(--ink)}
.filter-btn.active{background:var(--blue);color:white;border-color:var(--blue)}

.search-box{flex:1;padding:8px 12px;border:2px solid var(--border);border-radius:4px;font-size:13px;transition:border .15s}
.search-box:focus{outline:none;border-color:var(--blue);background:var(--blue-bg)}

.table-container{background:var(--surface);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.table{width:100%;border-collapse:collapse}
.table thead{background:var(--ink)}
.table th{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);padding:12px 16px;text-align:left;font-weight:500}
.table tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
.table tbody tr:hover{background:var(--surface2)}
.table tbody tr:last-child{border-bottom:none}
.table td{padding:12px 16px;font-size:13px}

.client-name{font-weight:600;color:var(--ink)}
.project-name{color:var(--ink-dim);font-size:12px;margin-top:2px}

.badge{display:inline-block;padding:4px 10px;border-radius:12px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.badge.active{background:var(--green-bg);color:var(--green)}
.badge.inactive{background:var(--red-bg);color:var(--red)}

.hours-cell{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink)}

.date-cell{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim)}

.toggle-switch{position:relative;width:44px;height:24px;background:var(--border-strong);border-radius:12px;cursor:pointer;transition:background .2s}
.toggle-switch.active{background:var(--green)}
.toggle-knob{position:absolute;top:3px;left:3px;width:18px;height:18px;background:white;border-radius:50%;transition:transform .2s}
.toggle-switch.active .toggle-knob{transform:translateX(20px)}

.empty-state{text-align:center;padding:60px 24px;color:var(--ink-dim)}
.empty-icon{font-size:64px;opacity:.3;margin-bottom:16px}
.empty-text{font-size:14px}

.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim)}
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a class="nav-back" href="index.html">← BMG</a>
    <span class="nav-sep">/</span>
    <span class="nav-title">Proyectos</span>
  </div>
</nav>

<div class="container" id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [proyectos, setProyectos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filtroEstado, setFiltroEstado] = useState('todos'); // todos, activos, inactivos
  const [busqueda, setBusqueda] = useState('');

  useEffect(() => {
    cargarDatos();
  }, []);

  const cargarDatos = () => {
    try {
      setLoading(true);
      
      // Cargar proyectos
      const proyectosData = localStorage.getItem('bmg_proyectos');
      if (proyectosData) {
        const proyectosObj = JSON.parse(proyectosData);
        const proyectosArray = Object.keys(proyectosObj).map(key => ({
          id: key,
          ...proyectosObj[key]
        }));
        setProyectos(proyectosArray);
      }
    } catch (error) {
      console.error('Error cargando datos:', error);
    } finally {
      setLoading(false);
    }
  };

  const calcularHorasTotales = (cliente, proyecto) => {
    try {
      const imputacionData = localStorage.getItem('bmg_datos_imputacion');
      if (!imputacionData) return 0;
      
      const imputaciones = JSON.parse(imputacionData);
      let totalHoras = 0;
      
      Object.values(imputaciones).forEach(imp => {
        imp.proyectos.forEach(p => {
          if (p.cliente === cliente && p.proyecto === proyecto) {
            totalHoras += p.horas;
          }
        });
      });
      
      return totalHoras;
    } catch (error) {
      return 0;
    }
  };

  const toggleActivo = (proyectoId) => {
    try {
      const proyectosData = localStorage.getItem('bmg_proyectos');
      const proyectosObj = JSON.parse(proyectosData);
      
      proyectosObj[proyectoId].activo = !proyectosObj[proyectoId].activo;
      
      localStorage.setItem('bmg_proyectos', JSON.stringify(proyectosObj));
      cargarDatos();
    } catch (error) {
      console.error('Error actualizando proyecto:', error);
    }
  };

  const formatearFecha = (isoDate) => {
    if (!isoDate) return '-';
    const fecha = new Date(isoDate);
    return fecha.toLocaleDateString('es-ES', { 
      day: '2-digit', 
      month: 'short', 
      year: 'numeric' 
    });
  };

  if (loading) {
    return <div className="loading">⏳ Cargando proyectos...</div>;
  }

  // Filtrar proyectos
  let proyectosFiltrados = proyectos;

  // Filtro por estado
  if (filtroEstado === 'activos') {
    proyectosFiltrados = proyectosFiltrados.filter(p => p.activo);
  } else if (filtroEstado === 'inactivos') {
    proyectosFiltrados = proyectosFiltrados.filter(p => !p.activo);
  }

  // Filtro por búsqueda
  if (busqueda.trim()) {
    const searchTerm = busqueda.toLowerCase();
    proyectosFiltrados = proyectosFiltrados.filter(p => 
      p.cliente.toLowerCase().includes(searchTerm) || 
      p.proyecto.toLowerCase().includes(searchTerm)
    );
  }

  const totalProyectos = proyectos.length;
  const proyectosActivos = proyectos.filter(p => p.activo).length;
  const proyectosInactivos = proyectos.filter(p => !p.activo).length;

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">Proyectos</div>
          <div className="page-sub">
            Gestión de clientes y proyectos
          </div>
        </div>
      </div>

      <div className="stats-grid">
        <div className="stat-card">
          <div className="stat-label">Total Proyectos</div>
          <div className="stat-val">{totalProyectos}</div>
          <div className="stat-sub">en el sistema</div>
        </div>
        <div className="stat-card active">
          <div className="stat-label">Activos</div>
          <div className="stat-val">{proyectosActivos}</div>
          <div className="stat-sub">recibiendo imputaciones</div>
        </div>
        <div className="stat-card inactive">
          <div className="stat-label">Inactivos</div>
          <div className="stat-val">{proyectosInactivos}</div>
          <div className="stat-sub">pausados o finalizados</div>
        </div>
      </div>

      <div className="filters">
        <span className="filter-label">Filtrar:</span>
        <button 
          className={`filter-btn ${filtroEstado === 'todos' ? 'active' : ''}`}
          onClick={() => setFiltroEstado('todos')}
        >
          Todos
        </button>
        <button 
          className={`filter-btn ${filtroEstado === 'activos' ? 'active' : ''}`}
          onClick={() => setFiltroEstado('activos')}
        >
          Activos
        </button>
        <button 
          className={`filter-btn ${filtroEstado === 'inactivos' ? 'active' : ''}`}
          onClick={() => setFiltroEstado('inactivos')}
        >
          Inactivos
        </button>
        <input 
          type="text"
          className="search-box"
          placeholder="🔍 Buscar cliente o proyecto..."
          value={busqueda}
          onChange={(e) => setBusqueda(e.target.value)}
        />
      </div>

      {proyectosFiltrados.length === 0 ? (
        <div className="table-container">
          <div className="empty-state">
            <div className="empty-icon">📋</div>
            <div className="empty-text">
              {proyectos.length === 0 
                ? 'No hay proyectos. Se crearán automáticamente al subir imputaciones.'
                : 'No se encontraron proyectos con estos filtros'}
            </div>
          </div>
        </div>
      ) : (
        <div className="table-container">
          <table className="table">
            <thead>
              <tr>
                <th>Cliente / Proyecto</th>
                <th>Horas Totales</th>
                <th>Fecha Creación</th>
                <th>Última Imputación</th>
                <th>Estado</th>
                <th>Activo</th>
              </tr>
            </thead>
            <tbody>
              {proyectosFiltrados.map(proyecto => {
                const horasTotales = calcularHorasTotales(proyecto.cliente, proyecto.proyecto);
                
                return (
                  <tr key={proyecto.id}>
                    <td>
                      <div className="client-name">{proyecto.cliente}</div>
                      <div className="project-name">{proyecto.proyecto}</div>
                    </td>
                    <td className="hours-cell">{horasTotales.toFixed(1)}h</td>
                    <td className="date-cell">{formatearFecha(proyecto.fechaCreacion)}</td>
                    <td className="date-cell">{formatearFecha(proyecto.ultimaImputacion)}</td>
                    <td>
                      <span className={`badge ${proyecto.activo ? 'active' : 'inactive'}`}>
                        {proyecto.activo ? 'Activo' : 'Inactivo'}
                      </span>
                    </td>
                    <td>
                      <div 
                        className={`toggle-switch ${proyecto.activo ? 'active' : ''}`}
                        onClick={() => toggleActivo(proyecto.id)}
                      >
                        <div className="toggle-knob"></div>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>

</body>
</html>
