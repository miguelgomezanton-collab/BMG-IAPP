<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facturación — BMG</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root {
  --bg:#f7f7f5; --surface:#ffffff; --surface2:#f2f2ef; --surface3:#e8e8e3;
  --border:#e0dfd9; --border-strong:#c8c7c0;
  --ink:#1a1a18; --ink-dim:#6b6b65; --ink-faint:#a8a8a2;
  --green:#1a6b3c; --green-bg:#eaf4ee; --green-border:#b8ddc6;
  --blue:#1a4a8a; --blue-bg:#eef3fc; --blue-border:#b8cde8;
  --amber:#9a5a00; --amber-bg:#fdf5e6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14px;min-height:100vh;display:flex;flex-direction:column}

nav{background:var(--ink);color:white;height:52px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-shrink:0}
.nav-left{display:flex;align-items:center;gap:16px}
.nav-back{font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(255,255,255,.45);cursor:pointer;padding:4px 0;transition:color .15s;text-decoration:none}
.nav-back:hover{color:rgba(255,255,255,.8)}
.nav-sep{color:rgba(255,255,255,.2)}
.nav-title{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.04em}
.nav-right{font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(255,255,255,.35)}

.layout{display:flex;flex:1;min-height:0}

.sidebar{width:196px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sb-head{padding:16px 16px 12px;border-bottom:1px solid var(--border)}
.sb-head-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:2px}
.sb-head-sub{font-size:11px;color:var(--ink-dim)}
.sb-months{flex:1;overflow-y:auto;padding:8px 0}
.sb-section-label{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);padding:10px 16px 4px}
.sb-month{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;cursor:pointer;font-size:12px;color:var(--ink-dim);transition:background .1s;border-left:2px solid transparent}
.sb-month:hover{background:var(--surface2);color:var(--ink)}
.sb-month.active{background:var(--blue-bg);color:var(--blue);border-left-color:var(--blue);font-weight:600}
.sb-month-indicator{font-size:10px}

.main{flex:1;overflow-y:auto;padding:0}
.main-inner{padding:24px 28px 60px;max-width:900px}

.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
.page-title{font-size:20px;font-weight:700;margin-bottom:6px}
.page-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint)}

.btn-new{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:var(--blue);color:white;border:none;border-radius:4px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-new:hover{background:#143d75;transform:translateY(-1px)}

.project-list{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.project-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px 20px;transition:box-shadow .15s}
.project-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}

.pc-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.pc-title{font-size:15px;font-weight:700;color:var(--ink)}
.pc-subtitle{font-size:12px;color:var(--ink-dim);margin-top:2px}

.pc-stats{display:flex;gap:20px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.pc-stat{display:flex;flex-direction:column;gap:2px}
.pc-stat-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.pc-stat-value{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--ink)}
.pc-stat-value.dim{color:var(--ink-dim)}

.pc-input-row{display:flex;align-items:center;gap:12px}
.pc-input-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);min-width:80px}
.pc-input-wrapper{flex:1;position:relative}
.pc-input{width:100%;padding:10px 12px 10px 24px;border:2px solid var(--border);border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;transition:all .15s}
.pc-input:focus{outline:none;border-color:var(--blue);background:var(--blue-bg)}
.pc-input.filled{border-color:var(--green-border);background:var(--green-bg)}
.pc-input-symbol{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-faint);pointer-events:none}

.btn-save{padding:10px 20px;background:var(--green);color:white;border:none;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-save:hover{background:#145c32;transform:translateY(-1px)}
.btn-save:disabled{background:var(--border);cursor:not-allowed;transform:none}

.empty-state{text-align:center;padding:60px 24px;color:var(--ink-dim);background:var(--surface);border:1px solid var(--border);border-radius:6px;margin-top:20px}
.empty-icon{font-size:64px;opacity:.3;margin-bottom:16px}
.empty-text{font-size:14px}

.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px}
.modal{background:var(--surface);border-radius:8px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:4px}
.modal-subtitle{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim)}
.modal-body{padding:20px 24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

.form-group{margin-bottom:16px}
.form-label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}
.form-input{width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:4px;font-size:14px;transition:all .15s}
.form-input:focus{outline:none;border-color:var(--blue);background:var(--blue-bg)}

.btn{padding:8px 16px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-secondary{background:var(--surface2);color:var(--ink-dim)}
.btn-secondary:hover{background:var(--surface3);color:var(--ink)}
.btn-primary{background:var(--blue);color:white}
.btn-primary:hover{background:#143d75}

.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim)}

.success-toast{position:fixed;bottom:24px;right:24px;background:var(--green);color:white;padding:12px 20px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:slideIn .3s ease;z-index:2000}
@keyframes slideIn{from{transform:translateY(100px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a class="nav-back" href="index.html">← BMG</a>
    <span class="nav-sep">/</span>
    <span class="nav-title">Facturación</span>
  </div>
  <div class="nav-right" id="nav-right">2026</div>
</nav>

<div class="layout">
  <div class="sidebar">
    <div class="sb-head">
      <div class="sb-head-label">Control Mensual</div>
      <div class="sb-head-sub">Facturación por proyecto</div>
    </div>
    <div class="sb-months" id="sb-months"></div>
  </div>

  <div class="main">
    <div class="main-inner" id="main-content"></div>
  </div>
</div>

<script type="text/babel">
const { useState, useEffect } = React;

const MESES = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
const MESES_CORTOS = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

function ProyectoCard({ proyecto, datos, mesActivo, factActual, guardarFacturacion, formatearEuros }) {
  const [valorInput, setValorInput] = React.useState(factActual);
  
  React.useEffect(() => {
    setValorInput(factActual);
  }, [factActual]);
  
  return (
    <div className="project-card">
      <div className="pc-header">
        <div>
          <div className="pc-title">{proyecto.cliente}</div>
          <div className="pc-subtitle">{proyecto.proyecto}</div>
        </div>
      </div>
      
      <div className="pc-stats">
        <div className="pc-stat">
          <div className="pc-stat-label">Horas {mesActivo}</div>
          <div className={`pc-stat-value ${datos.horas === 0 ? 'dim' : ''}`}>
            {datos.horas > 0 ? `${datos.horas.toFixed(1)}h` : 'Sin imputación'}
          </div>
        </div>
        <div className="pc-stat">
          <div className="pc-stat-label">Coste</div>
          <div className={`pc-stat-value ${datos.coste === 0 ? 'dim' : ''}`}>
            {datos.coste > 0 ? `${formatearEuros(datos.coste)}€` : '—'}
          </div>
        </div>
      </div>
      
      <div className="pc-input-row">
        <div className="pc-input-label">Facturación:</div>
        <div className="pc-input-wrapper">
          <span className="pc-input-symbol">€</span>
          <input
            type="number"
            className={`pc-input ${factActual > 0 ? 'filled' : ''}`}
            placeholder="0"
            value={valorInput || ''}
            onChange={(e) => setValorInput(e.target.value)}
            onKeyPress={(e) => {
              if (e.key === 'Enter') {
                guardarFacturacion(proyecto.cliente, proyecto.proyecto, valorInput);
              }
            }}
          />
        </div>
        <button
          className="btn-save"
          onClick={() => guardarFacturacion(proyecto.cliente, proyecto.proyecto, valorInput)}
        >
          💾 Guardar
        </button>
      </div>
    </div>
  );
}

function App() {
  const [mesActivo, setMesActivo] = useState('ENERO');
  const [loading, setLoading] = useState(true);
  const [proyectos, setProyectos] = useState([]);
  const [facturacion, setFacturacion] = useState({});
  const [costesHora, setCostesHora] = useState({});
  const [empleadosConfig, setEmpleadosConfig] = useState([]);
  const [mostrarModalNuevo, setMostrarModalNuevo] = useState(false);
  const [nuevoProyecto, setNuevoProyecto] = useState({ cliente: '', proyecto: '' });
  const [mostrarToast, setMostrarToast] = useState(false);

  useEffect(() => {
    cargarDatos();
  }, []);

  useEffect(() => {
    renderSidebar();
  }, [mesActivo, facturacion]);

  const cargarDatos = () => {
    try {
      setLoading(true);
      
      // Cargar proyectos
      const proyectosData = localStorage.getItem('bmg_proyectos');
      if (proyectosData) {
        const proyectosObj = JSON.parse(proyectosData);
        const proyectosArray = Object.keys(proyectosObj).map(key => ({
          id: key,
          ...proyectosObj[key]
        })).filter(p => p.activo);
        setProyectos(proyectosArray);
      }

      // Cargar facturación
      const factData = localStorage.getItem('bmg_facturacion');
      if (factData) {
        setFacturacion(JSON.parse(factData));
      }

      // Cargar costes/hora
      const costesData = localStorage.getItem('bmg_costes_hora');
      if (costesData) {
        setCostesHora(JSON.parse(costesData));
      }

      // Cargar empleados
      const empData = localStorage.getItem('bmg_empleados_config');
      if (empData) {
        setEmpleadosConfig(JSON.parse(empData));
      }
    } catch (error) {
      console.error('Error cargando datos:', error);
    } finally {
      setLoading(false);
    }
  };

  const renderSidebar = () => {
    const year = new Date().getFullYear();
    let html = `<div class="sb-section-label">${year}</div>`;
    
    MESES.forEach((mes, idx) => {
      const active = mes === mesActivo ? 'active' : '';
      
      // Contar proyectos facturados en este mes
      const facturados = proyectos.filter(p => {
        const key = `${mes}_${p.cliente}_${p.proyecto}`;
        return facturacion[key] && facturacion[key].importe > 0;
      }).length;
      
      const indicator = facturados > 0 ? `<span class="sb-month-indicator">✓</span>` : '';
      
      html += `
        <div class="sb-month ${active}" onclick="window.seleccionarMes('${mes}')">
          <span>${MESES_CORTOS[idx]}</span>
          ${indicator}
        </div>
      `;
    });
    
    document.getElementById('sb-months').innerHTML = html;
  };

  window.seleccionarMes = (mes) => {
    setMesActivo(mes);
    document.getElementById('nav-right').textContent = mes + ' 2026';
  };

  const obtenerCategoriaEmpleado = (nombreEmpleado) => {
    const empleado = empleadosConfig.find(e => e.nombre === nombreEmpleado);
    return empleado ? empleado.categoria : null;
  };

  const calcularDatosProyecto = (cliente, proyecto, mes) => {
    try {
      const imputacionData = localStorage.getItem('bmg_datos_imputacion');
      if (!imputacionData) return { horas: 0, coste: 0 };
      
      const imputaciones = JSON.parse(imputacionData);
      let totalHoras = 0;
      let totalCoste = 0;
      
      Object.entries(imputaciones).forEach(([key, imp]) => {
        if (imp.mes !== mes) return;
        
        const categoria = obtenerCategoriaEmpleado(imp.empleado);
        if (!categoria) return;
        
        imp.proyectos.forEach(p => {
          if (p.cliente === cliente && p.proyecto === proyecto) {
            totalHoras += p.horas;
            totalCoste += p.horas * (costesHora[categoria] || 0);
          }
        });
      });
      
      return { horas: totalHoras, coste: totalCoste };
    } catch (error) {
      return { horas: 0, coste: 0 };
    }
  };

  const formatearEuros = (cantidad) => {
    return new Intl.NumberFormat('es-ES', {
      minimumFractionDigits: 0,
      maximumFractionDigits: 0
    }).format(Math.round(cantidad));
  };

  const guardarFacturacion = (cliente, proyecto, importe) => {
    try {
      const key = `${mesActivo}_${cliente}_${proyecto}`;
      const nuevaFacturacion = {
        ...facturacion,
        [key]: {
          mes: mesActivo,
          cliente,
          proyecto,
          importe: parseFloat(importe) || 0
        }
      };
      
      setFacturacion(nuevaFacturacion);
      localStorage.setItem('bmg_facturacion', JSON.stringify(nuevaFacturacion));
      
      // Mostrar toast de éxito
      setMostrarToast(true);
      setTimeout(() => setMostrarToast(false), 3000);
    } catch (error) {
      alert('Error al guardar: ' + error.message);
    }
  };

  const crearNuevoProyecto = () => {
    if (!nuevoProyecto.cliente.trim() || !nuevoProyecto.proyecto.trim()) {
      alert('Debes completar ambos campos');
      return;
    }

    try {
      const proyectosData = localStorage.getItem('bmg_proyectos');
      const proyectosObj = proyectosData ? JSON.parse(proyectosData) : {};
      
      const key = `${nuevoProyecto.cliente}_${nuevoProyecto.proyecto}`;
      
      if (proyectosObj[key]) {
        alert('Este proyecto ya existe');
        return;
      }
      
      proyectosObj[key] = {
        cliente: nuevoProyecto.cliente,
        proyecto: nuevoProyecto.proyecto,
        activo: true,
        fechaCreacion: new Date().toISOString(),
        origenManual: true
      };
      
      localStorage.setItem('bmg_proyectos', JSON.stringify(proyectosObj));
      
      setMostrarModalNuevo(false);
      setNuevoProyecto({ cliente: '', proyecto: '' });
      cargarDatos();
    } catch (error) {
      alert('Error al crear proyecto: ' + error.message);
    }
  };

  if (loading) {
    return <div className="loading">⏳ Cargando facturación...</div>;
  }

  return (
    <>
      {/* TOAST DE ÉXITO */}
      {mostrarToast && (
        <div className="success-toast">
          ✓ Facturación guardada
        </div>
      )}

      {/* MODAL NUEVO PROYECTO */}
      {mostrarModalNuevo && (
        <div className="modal-overlay" onClick={() => setMostrarModalNuevo(false)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">Crear Nuevo Proyecto</div>
              <div className="modal-subtitle">Se añadirá a la lista de proyectos</div>
            </div>
            <div className="modal-body">
              <div className="form-group">
                <label className="form-label">Cliente *</label>
                <input
                  type="text"
                  className="form-input"
                  placeholder="Ej: AIQON"
                  value={nuevoProyecto.cliente}
                  onChange={(e) => setNuevoProyecto({ ...nuevoProyecto, cliente: e.target.value })}
                />
              </div>
              <div className="form-group">
                <label className="form-label">Proyecto *</label>
                <input
                  type="text"
                  className="form-input"
                  placeholder="Ej: Abogado"
                  value={nuevoProyecto.proyecto}
                  onChange={(e) => setNuevoProyecto({ ...nuevoProyecto, proyecto: e.target.value })}
                />
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={() => setMostrarModalNuevo(false)}>
                Cancelar
              </button>
              <button className="btn btn-primary" onClick={crearNuevoProyecto}>
                Crear Proyecto
              </button>
            </div>
          </div>
        </div>
      )}

      {/* CONTENIDO PRINCIPAL */}
      <div className="page-header">
        <div>
          <div className="page-title">Facturación — {mesActivo} 2026</div>
          <div className="page-sub">Ingresa el importe facturado por proyecto</div>
        </div>
        <button className="btn-new" onClick={() => setMostrarModalNuevo(true)}>
          <span>+</span>
          <span>Nuevo Proyecto</span>
        </button>
      </div>

      {proyectos.length === 0 ? (
        <div className="empty-state">
          <div className="empty-icon">💰</div>
          <div className="empty-text">
            No hay proyectos activos. Crea uno manualmente o sube imputaciones.
          </div>
        </div>
      ) : (
        <div className="project-list">
          {proyectos.map(p => {
            const datos = calcularDatosProyecto(p.cliente, p.proyecto, mesActivo);
            const key = `${mesActivo}_${p.cliente}_${p.proyecto}`;
            const factActual = facturacion[key]?.importe || 0;
            
            return (
              <ProyectoCard
                key={p.id}
                proyecto={p}
                datos={datos}
                mesActivo={mesActivo}
                factActual={factActual}
                guardarFacturacion={guardarFacturacion}
                formatearEuros={formatearEuros}
              />
            );
          })}
        </div>
      )}
    </>
  );
}

ReactDOM.render(<App />, document.getElementById('main-content'));
</script>

</body>
</html>
